; ToughnessFeast — RE_Kenshi plugin config
; Place next to ToughnessFeast.dll (mods/ToughnessFeast/)

; Soft-cap vanilla toughness combat benefits at this value.
; Above this: no extra damage resistance, no faster wound degen reduction.
CombatCapToughness=100

; Toughness level where food-powered regeneration unlocks.
; 75 = early access while still climbing to the combat soft-cap.
; 100 = only after vanilla toughness peaks.
FoodRegenStartToughness=75

; How strongly food regen scales per toughness point above FoodRegenStart.
; At Start+25 (e.g. 100 with start 75) power ~= 1.0
FoodRegenScalePerPoint=0.04

; HP healed per second at power 1.0 (before food availability)
FleshHealPerSecond=2.5

; Stun/flesh-stun cleared per second at power 1.0
StunHealPerSecond=1.5

; Hunger drained per second while actively regenerating at power 1.0
; (0–1 hunger scale used by Kenshi medical system)
HungerDrainPerSecond=0.012

; Minimum hunger (0–1) required to keep regenerating. Below this, regen pauses.
MinHungerToRegen=0.15

; Allow healing "unhealable" overdamage / deep flesh below 0 without a doctor.
HealUnhealableWounds=1

; Very slow stump/crushed flesh recovery (limb regrowth feel). 0 = off.
; Requires toughness well above FoodRegenStart and steady food.
LimbRegrowPerSecond=0.15

; Extra XP efficiency when training toughness past 100 (0.0–1.0)
Past100XpMult=0.18

; Log status lines to RE_Kenshi debug log (0/1)
DebugLog=0

; === TEST START (for trying food regen without grinding) ===
; When enabled, any player character below TestStartToughness is raised to it.
; Works on new games and existing saves. Set EnableTestStart=0 when done testing.
EnableTestStart=1
TestStartToughness=75
