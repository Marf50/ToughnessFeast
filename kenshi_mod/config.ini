# =============================================================================
# ToughnessFeast — config
# Hover HUNGER in the character medical panel for the Feast journal.
# =============================================================================

# Master switches
EnableHooks=1
EnableMedicalHooks=1
EnableLimbRestore=1
EnableTooltips=1
EnableCombatPenalty=1
DebugLog=1

# --- Combat soft-cap ---
# Damage resistance & wound degeneration ignore toughness above this.
# Excess toughness still trains and fuels Feast regen.
CombatCapToughness=100

# --- Feast unlock (toughness required) ---
# Hivers always have a light trickle (biology). Shek mid. Humans later.
UnlockHuman=75
UnlockShek=50
UnlockHiver=0
ScalePerPoint=0.045
ScaleHiver=0.014
PowerCap=3.0

# --- Food / wound healing ---
FleshHealPerSecond=1.35
StunHealPerSecond=0.90
HungerDrainPerSecond=0.012
MinHungerToRegen=0.15
HealUnhealableWounds=1
OverdamageHealMult=0.40

# --- Limb regrowth (slow on purpose) ---
# Bud stump → setLimb(ORIGINAL) weak → strengthen to LimbStrongPct
LimbRegrowPerSecond=0.07
LimbBudThreshold=0.40
LimbRestoredStartPct=0.18
LimbStrongPct=0.70

# --- XP past 100 ---
Past100XpMult=0.20

# --- Weak / missing limb combat pressure (per feast tick, mild) ---
WeakLimbDmgMult=0.88
WeakLimbDexMult=0.90
WeakLimbSpeedMult=0.92
WeakLimbDodgeMult=0.90

# --- UI ---
TooltipMaxLines=16
