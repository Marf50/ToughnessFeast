# =============================================================================
# ToughnessFeast — config
# Hover HUNGER for the Feast journal (live toughness, limbs, food use).
# =============================================================================

EnableHooks=1
EnableMedicalHooks=1
EnableLimbRestore=1
EnableTooltips=1
EnableCombatPenalty=1
DebugLog=1

# Combat soft-cap (DR / wound degen ignore toughness above this)
CombatCapToughness=100

# Feast unlock by race
UnlockHuman=75
UnlockShek=50
UnlockHiver=0
ScalePerPoint=0.0045
ScaleHiver=0.0022
PowerCap=1.5

# Food / wound healing (~90% slower than early builds)
FleshHealPerSecond=0.135
StunHealPerSecond=0.09
HungerDrainPerSecond=0.004
MinHungerToRegen=0.15
# Full hunger bar (player reports ~300). Heal rate scales 0..100% of this.
HungerBarMax=300
# Below this fill fraction, gradual feast heal/drain is 0 (won't starve you)
# MinHungerToRegen already set above
HealUnhealableWounds=1
OverdamageHealMult=0.25

# Limb pipeline (very slow — ~10% of old rate)
#   Missing/Crushed → bud to LimbStumpFormPct → STUMP (food dump + short KO)
#   Stump → bud to LimbBudThreshold → ORIGINAL weak (big food dump + long KO)
#   Weak limb → strengthen to LimbStrongPct
LimbRegrowPerSecond=0.0085
LimbStumpFormPct=0.12
LimbBudThreshold=0.40
LimbRestoredStartPct=0.18
LimbStrongPct=0.70

# One-shot costs when a stage completes (fraction of hunger bar 0..1)
StumpHungerCost=0.28
RestoreHungerCost=0.55
StumpKnockoutSeconds=8
RestoreKnockoutSeconds=18

# XP past 100
Past100XpMult=0.20

# Weak limb combat pressure
WeakLimbDmgMult=0.88
WeakLimbDexMult=0.90
WeakLimbSpeedMult=0.92
WeakLimbDodgeMult=0.90

TooltipMaxLines=16
