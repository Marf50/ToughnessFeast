; ToughnessFeast — RE_Kenshi plugin config
; Place next to ToughnessFeast.dll (mods/ToughnessFeast/)

; Soft-cap vanilla toughness combat benefits at this value.
; Above this: no extra damage resistance, no faster wound degen reduction.
CombatCapToughness=100

; --- Food-powered regen unlock (by race) ---
; Power = (toughness - start) * scale  (0 until start is reached)
; Hivers start at 0 with a gentler scale so early regen is only slight.
FoodRegenStartHiver=0
FoodRegenScaleHiver=0.012

FoodRegenStartShek=50
FoodRegenStartHuman=75
FoodRegenStartOther=75

; Scale used for Shek / Human / Other (at Start+25, power ~= 1.0)
FoodRegenScalePerPoint=0.04

; HP healed per second at power 1.0 (before food availability)
FleshHealPerSecond=2.5

; Stun/flesh-stun cleared per second at power 1.0
StunHealPerSecond=1.5

; Hunger drained per second while actively regenerating at power 1.0
HungerDrainPerSecond=0.012

; Minimum hunger (0–1) required to keep regenerating
MinHungerToRegen=0.15

; Allow healing "unhealable" overdamage / deep flesh below 0 without a doctor
HealUnhealableWounds=1

; Slow stump/crushed flesh recovery. 0 = off
LimbRegrowPerSecond=0.15

; Extra XP efficiency when training toughness past 100 (0.0–1.0)
Past100XpMult=0.18

; Log status lines to RE_Kenshi debug log (0/1)
DebugLog=0
