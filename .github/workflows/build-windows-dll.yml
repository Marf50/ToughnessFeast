name: Build Windows DLL

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: git lfs install

      - name: Clone KenshiLib deps (with LFS binaries)
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP "kenshi_deps"
          git clone --depth 1 https://github.com/BFrizzleFoShizzle/KenshiLib_Examples_deps.git $deps
          Push-Location $deps
          git lfs pull
          if (Test-Path "boost_1_60_0\boost.zip") {
            tar -xf "boost_1_60_0\boost.zip" --directory "boost_1_60_0"
          }
          $lib = Get-Item "KenshiLib\Libraries\KenshiLib.lib"
          if ($lib.Length -lt 10000) {
            throw "KenshiLib.lib looks like an LFS pointer ($($lib.Length) bytes). git lfs pull failed."
          }
          Write-Host "KenshiLib.lib size: $($lib.Length)"
          if (-not (Test-Path "boost_1_60_0\boost")) {
            throw "Boost headers missing after extract"
          }
          Pop-Location
          "KENSHI_DEPS=$deps" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake (MSVC x64)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DKENSHILIB_DIR=$env:KENSHI_DEPS\KenshiLib" `
            "-DBOOST_INCLUDE_DIR=$env:KENSHI_DEPS\boost_1_60_0" `
            -DTOUGHNESSFEAST_FORCE_GAME_BUILD=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage mod package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter ToughnessFeast.dll | Select-Object -First 1
          if (-not $dll) { throw "ToughnessFeast.dll not found after build" }
          Write-Host "Built: $($dll.FullName) ($($dll.Length) bytes)"
          New-Item -ItemType Directory -Force -Path dist_mod | Out-Null
          Copy-Item $dll.FullName dist_mod/ToughnessFeast.dll
          Copy-Item kenshi_mod/config.ini dist_mod/
          Copy-Item kenshi_mod/RE_Kenshi.json dist_mod/
          Copy-Item kenshi_mod/ToughnessFeast.mod dist_mod/
          Get-ChildItem dist_mod | Format-Table Name, Length


      - name: Build minimal load-test DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" || call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set DEPS=%KENSHI_DEPS%
          cl /nologo /O2 /MT /EHs-c- /D_HAS_EXCEPTIONS=0 /GR- /I"%DEPS%\KenshiLib\Include" /I"%DEPS%\boost_1_60_0" /c src\ToughnessFeast_minimal.cpp /Fo build\minimal.obj
          link /nologo /DLL /OUT:dist_mod\ToughnessFeast_minimal.dll build\minimal.obj /LIBPATH:"%DEPS%\KenshiLib\Libraries" KenshiLib.lib
          dir dist_mod

      - name: Upload DLL + mod folder
        uses: actions/upload-artifact@v4
        with:
          name: ToughnessFeast-mod
          path: dist_mod/
          if-no-files-found: error
